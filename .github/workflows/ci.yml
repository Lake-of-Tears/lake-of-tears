name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.5.7

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  security-sast:
    name: "Security: SAST (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]==1.7.9

      - name: Run bandit
        run: bandit -r backend/ pipeline/ ui/ -ll -c pyproject.toml

  security-deps:
    name: "Security: Dependencies (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit>=2.8.0

      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt -r ui/requirements.txt

  security-docker:
    name: "Security: Dockerfiles (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Scan Dockerfiles
        run: |
          trivy config backend/Dockerfile --severity HIGH,CRITICAL --exit-code 1
          trivy config ui/Dockerfile --severity HIGH,CRITICAL --exit-code 1
          trivy config deploy/airflow/Dockerfile --severity HIGH,CRITICAL --exit-code 1

  docker-build-backend:
    name: "Build Image: Backend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend/
          push: false
          tags: lake-of-tears-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-ui:
    name: "Build Image: UI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: ui/
          push: false
          tags: lake-of-tears-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-airflow:
    name: "Build Image: Airflow"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Airflow image
        uses: docker/build-push-action@v7
        with:
          context: deploy/airflow
          file: deploy/airflow/Dockerfile
          push: false
          tags: lake-of-tears-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: "Helm: Chart Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: "3.15.0"

      - name: Lint Helm chart
        run: helm lint deploy/helm/lake-of-tears --namespace lake-of-tears

      - name: Template validation (local values)
        run: helm template test deploy/helm/lake-of-tears --namespace lake-of-tears -f deploy/helm/values-local.example.yaml > /dev/null

  test:
    name: Unit Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest==8.3.3 pandas -r ui/requirements.txt -r backend/requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  summary:
    name: CI Summary & Deployment Tag
    runs-on: ubuntu-latest
    needs:
      - lint
      - security-sast
      - security-deps
      - security-docker
      - docker-build-backend
      - docker-build-ui
      - docker-build-airflow
      - helm-lint
      - test
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Generate Build Tag, Push Git Release Tag, and Render Summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SAST_RESULT: ${{ needs.security-sast.result }}
          DEPS_RESULT: ${{ needs.security-deps.result }}
          DOCKER_SEC_RESULT: ${{ needs.security-docker.result }}
          BACKEND_RESULT: ${{ needs.docker-build-backend.result }}
          UI_RESULT: ${{ needs.docker-build-ui.result }}
          AIRFLOW_RESULT: ${{ needs.docker-build-airflow.result }}
          HELM_RESULT: ${{ needs.helm-lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          # 1. Compute standardized build tag
          APP_VERSION=$(grep '^appVersion:' deploy/helm/lake-of-tears/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(grep '^version:' deploy/helm/lake-of-tears/Chart.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_TAG="v${APP_VERSION}-build.${{ github.run_number }}-${SHORT_SHA}"
          echo "Generated Build Tag: $BUILD_TAG"

          # 2. Status formatting helper
          format_status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⏹️ Cancelled" ;;
              *) echo "⏭️ Skipped" ;;
            esac
          }

          LINT_STATUS=$(format_status "$LINT_RESULT")
          SAST_STATUS=$(format_status "$SAST_RESULT")
          DEPS_STATUS=$(format_status "$DEPS_RESULT")
          DOCKER_SEC_STATUS=$(format_status "$DOCKER_SEC_RESULT")
          BUILD_BACKEND_STATUS=$(format_status "$BACKEND_RESULT")
          BUILD_UI_STATUS=$(format_status "$UI_RESULT")
          BUILD_AIRFLOW_STATUS=$(format_status "$AIRFLOW_RESULT")
          HELM_STATUS=$(format_status "$HELM_RESULT")
          TEST_STATUS=$(format_status "$TEST_RESULT")

          # Check if all upstream jobs succeeded
          ALL_SUCCESS=true
          for res in "$LINT_RESULT" "$SAST_RESULT" "$DEPS_RESULT" "$DOCKER_SEC_RESULT" \
                     "$BACKEND_RESULT" "$UI_RESULT" "$AIRFLOW_RESULT" "$HELM_RESULT" "$TEST_RESULT"; do
            if [ "$res" != "success" ]; then
              ALL_SUCCESS=false
              break
            fi
          done

          # 3. Create and push Git tag when running on main branch push with all checks passing
          TAG_RELEASED="ℹ️ PR / Branch Preview (Not Tagged in Git)"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ] && [ "$ALL_SUCCESS" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if git ls-remote --tags origin "$BUILD_TAG" | grep -q "$BUILD_TAG"; then
              echo "Tag $BUILD_TAG already exists on remote"
              TAG_RELEASED="✅ Tag already exists (\`$BUILD_TAG\`)"
            else
              git tag -a "$BUILD_TAG" -m "Automated build release $BUILD_TAG from CI run #${{ github.run_number }}"
              git push origin "$BUILD_TAG"
              TAG_RELEASED="🚀 Released & Pushed to Git (\`$BUILD_TAG\`)"
            fi
          elif [ "$ALL_SUCCESS" != "true" ]; then
            TAG_RELEASED="❌ Build Failed (No Tag Created)"
          fi

          # 4. Generate GitHub Step Summary Markdown
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 💧 Lake of Tears — CI Build & Validation Summary

          ### 🏷️ Build Information
          | Parameter | Value |
          |---|---|
          | **Build Tag** | \`$BUILD_TAG\` |
          | **Commit** | [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Branch / Ref** | \`${{ github.ref_name }}\` |
          | **Workflow Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | **Triggered By** | \`${{ github.actor }}\` via \`${{ github.event_name }}\` |
          | **Git Release Tag** | $TAG_RELEASED |

          ### 🚦 Pipeline Execution Status
          | Job Stage | Status | Details |
          |---|:---:|---|
          | **Code Quality** | $LINT_STATUS | Ruff Python linting & formatting checks |
          | **Security: SAST** | $SAST_STATUS | Bandit static application security scan |
          | **Security: Dependencies** | $DEPS_STATUS | pip-audit vulnerability audit |
          | **Security: Dockerfiles** | $DOCKER_SEC_STATUS | Trivy configuration scan (backend, ui, airflow) |
          | **Docker: Backend** | $BUILD_BACKEND_STATUS | Built image \`lake-of-tears-backend:ci\` |
          | **Docker: UI** | $BUILD_UI_STATUS | Built image \`lake-of-tears-ui:ci\` |
          | **Docker: Airflow** | $BUILD_AIRFLOW_STATUS | Built image \`lake-of-tears-airflow:ci\` |
          | **Helm Validation** | $HELM_STATUS | Chart syntax lint & local values template render |
          | **Unit Test Suite** | $TEST_STATUS | Pytest automated test execution |

          ### 🚀 Deploy with this Build Tag
          To deploy or upgrade a Kubernetes deployment using this build tag:
          \`\`\`bash
          helm upgrade lake-of-tears ./deploy/helm/lake-of-tears \\
            --namespace lake-of-tears \\
            --set backend.image.tag=$BUILD_TAG \\
            --set lakeui.image.tag=$BUILD_TAG \\
            --set airflow.image.tag=$BUILD_TAG
          \`\`\`
          EOF

          # 5. Fail the summary step if any upstream job failed
          if [ "$ALL_SUCCESS" != "true" ]; then
            echo "::error::One or more upstream CI jobs failed."
            exit 1
          fi
