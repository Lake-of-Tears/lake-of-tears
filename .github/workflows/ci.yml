name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.5.7

      - name: Check linting
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit[toml]==1.7.9 pip-audit>=2.8.0

      - name: Run bandit
        run: bandit -r backend/ pipeline/ ui/ -ll -c pyproject.toml

      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt -r ui/requirements.txt

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Run Trivy Dockerfile scan
        run: |
          trivy config backend/Dockerfile --severity HIGH,CRITICAL --exit-code 1
          trivy config ui/Dockerfile --severity HIGH,CRITICAL --exit-code 1

  docker-build:
    name: Docker Build (UI & Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: ui/
          push: false
          tags: lake-of-tears-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend/
          push: false
          tags: lake-of-tears-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: "3.15.0"

      - name: Lint Helm chart
        run: helm lint deploy/helm/lake-of-tears --namespace lake-of-tears

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest==8.3.3 pandas -r ui/requirements.txt -r backend/requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Check formatting
        run: terraform fmt -check -recursive deploy/terraform/

      # Only the foundation module is validated for now: the services module has stale file paths
      # and references and does not validate yet (tracked in #227).
      - name: Validate foundation module
        working-directory: deploy/terraform/foundation
        run: |
          terraform init -backend=false -input=false
          terraform validate
