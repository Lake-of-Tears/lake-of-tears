name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before filing, please check the [existing issues](https://github.com/Lake-of-Tears/lake-of-tears/issues) and the [docs at thelakeoftears.com](https://thelakeoftears.com).

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the stack is affected?
      options:
        - Lake UI (FastAPI dashboard)
        - Pipeline — ingest
        - Pipeline — embed / summarize / anomaly detect
        - Pipeline — RAG query
        - Helm / Kubernetes deployment
        - Documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy with `helm upgrade --install lake-of-tears ./deploy/helm/lake-of-tears ...`
        2. Open http://localhost/
        3. Run query: ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        OS: macOS 15 / Ubuntu 24.04
        Kubernetes version / provider: OrbStack / k3s / EKS
        Helm version: 3.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant output from `kubectl logs`
      render: shell
