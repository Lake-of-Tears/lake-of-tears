version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: pip
    directories:
      - /ui
      - /backend
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /ui
      - /backend
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      - dependency-name: python
        versions: [">= 3.13"]
