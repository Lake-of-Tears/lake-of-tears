# =============================================================================
# Lake of Tears — Helm Chart Values
# =============================================================================
# Copy this file and override values as needed:
#
#   helm upgrade --install lake-of-tears ./deploy/helm/lake-of-tears \
#     --namespace lake-of-tears \
#     --create-namespace \
#     --set minio.rootPassword=changeme \
#     -f my-values.yaml
#
# All passwords and API keys should be supplied at install time via --set or
# a local values override file. Do NOT commit secrets into version control.
# =============================================================================

# ---------------------------------------------------------------------------
# Global
# ---------------------------------------------------------------------------
global:
  # StorageClass used for all PersistentVolumeClaims.
  # Leave empty to use the cluster default StorageClass.
  # For NFS-backed storage (e.g. TrueNAS), set to your NFS StorageClass name.
  storageClass: ""

  # Set to true to bypass the namespace guard if deploying into 'default'
  allowDefaultNamespace: false

# ---------------------------------------------------------------------------
# MinIO CE — S3-compatible object storage
# ---------------------------------------------------------------------------
minio:
  image:
    repository: ghcr.io/coollabsio/minio
    tag: latest
    pullPolicy: IfNotPresent

  # MinIO client image used for initialization jobs (creating buckets, aliases)
  clientImage:
    repository: ghcr.io/coollabsio/minio
    tag: latest
    pullPolicy: IfNotPresent

  # Root credentials — REQUIRED, no defaults
  rootUser: ""
  rootPassword: ""

  # Buckets to create on first startup (via minio-init job)
  buckets:
    - datalake

  persistence:
    size: 200Gi
    accessMode: ReadWriteOnce

  service:
    apiPort: 9000
    consolePort: 9001

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# Lake UI — FastAPI + Tailwind unified shell
# ---------------------------------------------------------------------------
lakeui:
  image:
    repository: lake-of-tears-ui
    tag: latest
    pullPolicy: IfNotPresent

  # URL users can reach the MinIO console — set to your ingress minioConsoleHost
  # e.g. https://minio.example.com   (Kubernetes)
  #      http://localhost:9001        (local Docker Compose)
  minioConsoleUrl: ""

  # Full URL to the Superset instance (used as iframe src in the Visualizations page).
  # In Kubernetes: set to http(s)://<ingress.supersetHost>
  # In local Docker Compose: set to http://localhost:8088
  supersetUrl: ""

  service:
    port: 3000

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# JupyterLab — interactive data exploration
# ---------------------------------------------------------------------------
jupyter:
  image:
    repository: jupyter/datascience-notebook
    tag: latest
    pullPolicy: IfNotPresent

  # Access token for JupyterLab — REQUIRED
  token: ""

  service:
    port: 8888

  # External Ingress exposure — disabled by default as Lake UI natively proxies notebooks
  ingress:
    enabled: false

  # Notebooks (workspaces/) and work/ live on a PersistentVolumeClaim of this size, so they survive
  # pod restarts. Upgrading an existing install mounts an empty volume over those folders:
  # export any notebooks you want to keep first.
  persistence:
    size: 10Gi

  # Lets the notebook user (jovyan, group users = 100) write to the volume.
  podSecurityContext:
    fsGroup: 100

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# Apache Superset — dashboards and BI
# ---------------------------------------------------------------------------
superset:
  image:
    repository: apache/superset
    tag: "4.1.4"
    pullPolicy: IfNotPresent

  # Flask secret key — REQUIRED
  secretKey: ""

  # Admin account password — REQUIRED
  adminPassword: ""

  service:
    port: 8088

  persistence:
    size: 1Gi

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---------------------------------------------------------------------------
# Apache Airflow — pipeline orchestration
# ---------------------------------------------------------------------------
airflow:
  image:
    repository: lake-of-tears-airflow
    tag: latest
    pullPolicy: Never

  # Flask secret key — REQUIRED
  secretKey: ""

  # Admin account password — REQUIRED
  adminPassword: ""

  service:
    port: 8080

  persistence:
    size: 1Gi

  # Additional pip packages installed at container startup via _PIP_ADDITIONAL_REQUIREMENTS
  extraPipPackages: []

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 50000
    runAsGroup: 0
    fsGroup: 50000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Wait for PostgreSQL to be ready before starting airflow
  waitForDb:
    enabled: true
    timeoutSeconds: 60

# ---------------------------------------------------------------------------
# Auth backend — FastAPI service handling login, SSO, and user management
# ---------------------------------------------------------------------------
backend:
  enabled: true

  image:
    repository: lake-of-tears-backend
    tag: latest
    pullPolicy: Never

  auth:
    # REQUIRED — generate with: python -c "import secrets; print(secrets.token_hex(32))"
    secretKey: ""
    # Public base URL — used for OAuth callback redirect URIs
    baseUrl: "http://localhost"
    # Enable or disable public account self-registration and new SSO account creation
    registrationEnabled: true

  # Email notifications & user invitations (SMTP)
  smtp:
    host: ""
    port: 587
    user: ""
    password: ""
    fromAddr: ""

  google:
    enabled: false
    clientId: ""
    clientSecret: ""

  github:
    enabled: false
    clientId: ""
    clientSecret: ""

  microsoft:
    enabled: false
    clientId: ""
    clientSecret: ""
    tenantId: "common"

  apple:
    enabled: false
    clientId: ""
    teamId: ""
    keyId: ""
    privateKey: ""

  okta:
    enabled: false
    clientId: ""
    clientSecret: ""
    domain: ""

  gitlab:
    enabled: false
    clientId: ""
    clientSecret: ""
    url: "https://gitlab.com"

  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    authUrl: ""
    tokenUrl: ""
    userinfoUrl: ""
    scope: "openid email profile"
    displayName: "SSO"

  service:
    port: 8000

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Wait for PostgreSQL to be ready before starting backend
  waitForDb:
    enabled: true
    timeoutSeconds: 60

# ---------------------------------------------------------------------------
# PostgreSQL — auth database
# ---------------------------------------------------------------------------
postgres:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: lake_auth
    username: lake_auth
    password: ""  # REQUIRED

  airflow:
    username: airflow
    password: ""  # REQUIRED — set in values-secret.yaml

  persistence:
    size: 5Gi

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # External Postgres DSN used by Airflow pipeline scripts (optional, unrelated to auth)
  dsn: ""

# ---------------------------------------------------------------------------
# Data source credentials (all optional — omit sources you don't use)
# ---------------------------------------------------------------------------
stripe:
  secretKey: ""

shopify:
  storeDomain: ""
  accessToken: ""

hubspot:
  accessToken: ""

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx

  # Primary hostname — serves Lake UI (including notebooks) and Pipelines (/airflow/)
  host: lake.example.com

  # MinIO console is exposed on its own subdomain.
  # Path-based proxying of the MinIO console SPA is unreliable; set lakeui.minioConsoleUrl
  # to this value so the Storage page links users to the right URL.
  minioConsoleHost: minio.example.com

  # MinIO S3 API hostname (for external S3 clients and tools like DBeaver)
  minioApiHost: minio-api.example.com

  # Superset is exposed on its own subdomain (path-based proxying breaks asset URLs).
  # Set lakeui.supersetUrl to http(s)://<supersetHost> so the UI iframe points here.
  supersetHost: superset.example.com

  # Additional annotations merged onto every Ingress resource
  annotations: {}

  # TLS — list of { secretName, hosts } objects
  tls: []
  # Example:
  #   - secretName: lake-of-tears-tls
  #     hosts:
  #       - lake.example.com
  #       - minio.example.com
  #       - minio-api.example.com
