---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lake-of-tears.fullname" . }}-jupyter
  labels:
    {{- include "lake-of-tears.labels" . | nindent 4 }}
    app.kubernetes.io/component: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lake-of-tears.name" . }}
      app.kubernetes.io/component: jupyter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lake-of-tears.name" . }}
        app.kubernetes.io/component: jupyter
    spec:
      {{- with .Values.jupyter.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: jupyter
          {{- with .Values.jupyter.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ .Values.jupyter.image.repository }}:{{ .Values.jupyter.image.tag }}
          imagePullPolicy: {{ .Values.jupyter.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              pip install duckdb requests boto3 google-genai --quiet &&
              pip install --force-reinstall 'anyio>=4.13' 'jupyter_server>=2.14' --quiet &&
              start-notebook.py \
                --ServerApp.base_url='/jupyter/' \
                --ServerApp.allow_origin='*'
          env:
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: JUPYTER_TOKEN
            - name: MINIO_ENDPOINT
              value: "{{ include "lake-of-tears.fullname" . }}-minio:{{ .Values.minio.service.apiPort }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: BACKEND_URL
              value: "http://{{ include "lake-of-tears.fullname" . }}-backend:8000"
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: authSecretKey
          ports:
            - name: http
              containerPort: {{ .Values.jupyter.service.port }}
          volumeMounts:
            # The Lake UI creates notebooks under workspaces/ in Jupyter's root folder.
            - name: jupyter-home
              mountPath: /home/jovyan/workspaces
              subPath: workspaces
            - name: jupyter-home
              mountPath: /home/jovyan/work
              subPath: work
          resources:
            {{- toYaml .Values.jupyter.resources | nindent 12 }}
      volumes:
        - name: jupyter-home
          persistentVolumeClaim:
            claimName: {{ include "lake-of-tears.fullname" . }}-jupyter-home

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lake-of-tears.fullname" . }}-jupyter
  labels:
    {{- include "lake-of-tears.labels" . | nindent 4 }}
    app.kubernetes.io/component: jupyter
spec:
  selector:
    app.kubernetes.io/name: {{ include "lake-of-tears.name" . }}
    app.kubernetes.io/component: jupyter
  ports:
    - name: http
      port: {{ .Values.jupyter.service.port }}
      targetPort: http
