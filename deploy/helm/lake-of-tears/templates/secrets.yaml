apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lake-of-tears.fullname" . }}-credentials
  labels:
    {{- include "lake-of-tears.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER:        {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD:    {{ required "minio.rootPassword is required" .Values.minio.rootPassword | quote }}
  JUPYTER_TOKEN:          {{ required "jupyter.token is required" .Values.jupyter.token | quote }}
  SUPERSET_SECRET_KEY:    {{ required "superset.secretKey is required" .Values.superset.secretKey | quote }}
  SUPERSET_ADMIN_PASSWORD: {{ required "superset.adminPassword is required" .Values.superset.adminPassword | quote }}
  AIRFLOW_SECRET_KEY:     {{ required "airflow.secretKey is required" .Values.airflow.secretKey | quote }}
  AIRFLOW_ADMIN_PASSWORD: {{ required "airflow.adminPassword is required" .Values.airflow.adminPassword | quote }}
  AIRFLOW_DB_CONN:        {{ printf "postgresql+psycopg2://airflow:%s@%s-postgres:5432/airflow" (required "postgres.airflow.password is required" .Values.postgres.airflow.password) (include "lake-of-tears.fullname" .) | quote }}
  STRIPE_SECRET_KEY:      {{ .Values.stripe.secretKey | quote }}
  SHOPIFY_STORE_DOMAIN:   {{ .Values.shopify.storeDomain | quote }}
  SHOPIFY_ACCESS_TOKEN:   {{ .Values.shopify.accessToken | quote }}
  HUBSPOT_ACCESS_TOKEN:   {{ .Values.hubspot.accessToken | quote }}
  POSTGRES_DSN:           {{ .Values.postgres.dsn | quote }}
  # Auth backend secrets
  authSecretKey:          {{ required "backend.auth.secretKey is required" .Values.backend.auth.secretKey | quote }}
  postgresAuthPassword:   {{ required "postgres.auth.password is required" .Values.postgres.auth.password | quote }}
  googleClientSecret:     {{ .Values.backend.google.clientSecret | quote }}
  githubClientSecret:     {{ .Values.backend.github.clientSecret | quote }}
  microsoftClientSecret:  {{ .Values.backend.microsoft.clientSecret | quote }}
  oidcClientSecret:       {{ .Values.backend.oidc.clientSecret | quote }}
