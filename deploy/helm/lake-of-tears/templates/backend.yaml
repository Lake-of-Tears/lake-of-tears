{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lake-of-tears.fullname" . }}-backend
  labels: {{ include "lake-of-tears.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "lake-of-tears.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "lake-of-tears.fullname" . }}-backend
    spec:
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.postgres.enabled (dig "waitForDb" "enabled" true .Values.backend) }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              start_time=$(date +%s)
              timeout={{ dig "waitForDb" "timeoutSeconds" 60 .Values.backend }}
              echo "Waiting for PostgreSQL at {{ include "lake-of-tears.fullname" . }}-postgres:5432 (database: {{ .Values.postgres.auth.database }})..."
              until pg_isready -h {{ include "lake-of-tears.fullname" . }}-postgres -p 5432 -U {{ .Values.postgres.auth.username }} -d {{ .Values.postgres.auth.database }}; do
                current_time=$(date +%s)
                elapsed=$((current_time - start_time))
                if [ $elapsed -ge $timeout ]; then
                  echo "Error: Timed out after ${timeout}s waiting for PostgreSQL to become ready." >&2
                  exit 1
                fi
                echo "PostgreSQL not ready yet (${elapsed}s elapsed). Retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      {{- end }}
      containers:
        - name: backend
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: postgresAuthPassword
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.auth.username }}:$(POSTGRES_AUTH_PASSWORD)@{{ include "lake-of-tears.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: authSecretKey
            - name: AUTH_BASE_URL
              value: {{ .Values.backend.auth.baseUrl | quote }}
            - name: AUTH_REGISTRATION_ENABLED
              value: {{ if hasKey .Values.backend.auth "registrationEnabled" }}{{ .Values.backend.auth.registrationEnabled | quote }}{{ else }}"true"{{ end }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.backend.google.clientId | quote }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: googleClientSecret
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.backend.github.clientId | quote }}
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: githubClientSecret
            - name: MICROSOFT_CLIENT_ID
              value: {{ .Values.backend.microsoft.clientId | quote }}
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: microsoftClientSecret
            - name: MICROSOFT_TENANT_ID
              value: {{ .Values.backend.microsoft.tenantId | quote }}
            - name: OKTA_CLIENT_ID
              value: {{ .Values.backend.okta.clientId | default "" | quote }}
            - name: OKTA_DOMAIN
              value: {{ .Values.backend.okta.domain | default "" | quote }}
            - name: GITLAB_CLIENT_ID
              value: {{ .Values.backend.gitlab.clientId | default "" | quote }}
            - name: GITLAB_URL
              value: {{ .Values.backend.gitlab.url | default "https://gitlab.com" | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.backend.oidc.issuerUrl | default "" | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.backend.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: oidcClientSecret
            - name: OIDC_AUTH_URL
              value: {{ .Values.backend.oidc.authUrl | quote }}
            - name: OIDC_TOKEN_URL
              value: {{ .Values.backend.oidc.tokenUrl | quote }}
            - name: OIDC_USERINFO_URL
              value: {{ .Values.backend.oidc.userinfoUrl | quote }}
            - name: OIDC_SCOPE
              value: {{ .Values.backend.oidc.scope | quote }}
            - name: OIDC_DISPLAY_NAME
              value: {{ .Values.backend.oidc.displayName | quote }}
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: JUPYTER_TOKEN
            - name: JUPYTER_SERVER_URL
              value: "http://{{ include "lake-of-tears.fullname" . }}-jupyter:{{ .Values.jupyter.service.port }}"
            - name: JUPYTER_BASE_URL
              value: "/jupyter"
            - name: MINIO_ENDPOINT
              value: "{{ include "lake-of-tears.fullname" . }}-minio:{{ .Values.minio.service.apiPort }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              value: datalake
            - name: MINIO_PUBLIC_ENDPOINT
              value: "http://{{ .Values.ingress.minioApiHost | default "s3.localhost" }}"
            - name: AIRFLOW_URL
              value: "http://{{ include "lake-of-tears.fullname" . }}-airflow:{{ .Values.airflow.service.port }}/airflow"
            - name: AIRFLOW_ADMIN_USER
              value: "admin"
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: AIRFLOW_ADMIN_PASSWORD
            - name: AIRFLOW_DAGS_DIR
              value: "/opt/airflow/dags"
            - name: SUPERSET_URL
              value: "http://{{ include "lake-of-tears.fullname" . }}-superset:{{ .Values.superset.service.port }}/superset"
            - name: SUPERSET_PUBLIC_URL
              value: "http://{{ .Values.ingress.supersetHost | default "superset.localhost" }}"
            - name: SUPERSET_ADMIN_USERNAME
              value: "admin"
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: SUPERSET_ADMIN_PASSWORD
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: SUPERSET_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{ toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: airflow-home
              mountPath: /opt/airflow
      volumes:
        - name: airflow-home
          persistentVolumeClaim:
            claimName: {{ include "lake-of-tears.fullname" . }}-airflow-home
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lake-of-tears.fullname" . }}-backend
  labels: {{ include "lake-of-tears.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "lake-of-tears.fullname" . }}-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
{{- end }}
