---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lake-of-tears.fullname" . }}-airflow
  labels:
    {{- include "lake-of-tears.labels" . | nindent 4 }}
    app.kubernetes.io/component: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lake-of-tears.name" . }}
      app.kubernetes.io/component: airflow
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lake-of-tears.name" . }}
        app.kubernetes.io/component: airflow
    spec:
      {{- with .Values.airflow.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.postgres.enabled (dig "waitForDb" "enabled" true .Values.airflow) }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          {{- with .Values.airflow.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              start_time=$(date +%s)
              timeout={{ dig "waitForDb" "timeoutSeconds" 60 .Values.airflow }}
              echo "Waiting for PostgreSQL at {{ include "lake-of-tears.fullname" . }}-postgres:5432 (database: airflow)..."
              until pg_isready -h {{ include "lake-of-tears.fullname" . }}-postgres -p 5432 -U {{ .Values.postgres.airflow.username }} -d airflow; do
                current_time=$(date +%s)
                elapsed=$((current_time - start_time))
                if [ $elapsed -ge $timeout ]; then
                  echo "Error: Timed out after ${timeout}s waiting for PostgreSQL to become ready." >&2
                  exit 1
                fi
                echo "PostgreSQL not ready yet (${elapsed}s elapsed). Retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      {{- end }}
      containers:
        - name: airflow
          {{- with .Values.airflow.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}
          imagePullPolicy: {{ .Values.airflow.image.pullPolicy }}
          command: ["/usr/bin/dumb-init", "--", "/bin/bash", "-c"]
          args:
            - |
              rm -f /opt/airflow/airflow-webserver.pid
              (
                sleep 5
                airflow users reset-password -u admin -p "$_AIRFLOW_WWW_USER_PASSWORD" 2>/dev/null || true
                airflow dags unpause refresh_catalog_schemas 2>/dev/null || true
              ) &
              exec /entrypoint standalone
          env:
            - name: CONNECTION_CHECK_MAX_COUNT
              value: "0"
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: AIRFLOW_DB_CONN
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "False"
            - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
              value: "5"
            - name: AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL
              value: "5"
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: /opt/airflow/dags
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: AIRFLOW_SECRET_KEY
            # BASE_URL tells Airflow to prefix all generated links with /airflow/.
            # The nginx Ingress strips this prefix before forwarding to the pod.
            - name: AIRFLOW__WEBSERVER__BASE_URL
              value: "{{ if .Values.ingress.tls }}https{{ else }}http{{ end }}://{{ .Values.ingress.host }}/airflow"
            - name: AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX
              value: "True"
            - name: AIRFLOW__WEBSERVER__PROXY_FIX_X_FOR
              value: "1"
            - name: AIRFLOW__WEBSERVER__PROXY_FIX_X_HOST
              value: "1"
            - name: AIRFLOW__WEBSERVER__PROXY_FIX_X_PREFIX
              value: "1"
            - name: AIRFLOW__WEBSERVER__WORKERS
              value: "2"
            - name: _AIRFLOW_WWW_USER_USERNAME
              value: admin
            - name: _AIRFLOW_WWW_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: AIRFLOW_ADMIN_PASSWORD
            - name: _PIP_ADDITIONAL_REQUIREMENTS
              value: {{ .Values.airflow.extraPipPackages | join " " | quote }}
            - name: JUPYTER_SERVER_URL
              value: "http://{{ include "lake-of-tears.fullname" . }}-jupyter:{{ .Values.jupyter.service.port }}"
            - name: JUPYTER_BASE_URL
              value: "/jupyter"
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: JUPYTER_TOKEN
            - name: MINIO_ENDPOINT
              value: "{{ include "lake-of-tears.fullname" . }}-minio:{{ .Values.minio.service.apiPort }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BUCKET
              value: datalake
            - name: BACKEND_URL
              value: "http://{{ include "lake-of-tears.fullname" . }}-backend:8000"
            - name: POSTGRES_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: postgresAuthPassword
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.auth.username }}:$(POSTGRES_AUTH_PASSWORD)@{{ include "lake-of-tears.fullname" . }}-postgres:5432/{{ .Values.postgres.auth.database }}"
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: authSecretKey
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: STRIPE_SECRET_KEY
            - name: SHOPIFY_STORE_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: SHOPIFY_STORE_DOMAIN
            - name: SHOPIFY_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: SHOPIFY_ACCESS_TOKEN
            - name: HUBSPOT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: HUBSPOT_ACCESS_TOKEN
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lake-of-tears.fullname" . }}-credentials
                  key: POSTGRES_DSN
          ports:
            - name: http
              containerPort: {{ .Values.airflow.service.port }}
          livenessProbe:
            httpGet:
              path: /airflow/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: airflow-home
              mountPath: /opt/airflow
          resources:
            {{- toYaml .Values.airflow.resources | nindent 12 }}
      volumes:
        - name: airflow-home
          persistentVolumeClaim:
            claimName: {{ include "lake-of-tears.fullname" . }}-airflow-home

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lake-of-tears.fullname" . }}-airflow
  labels:
    {{- include "lake-of-tears.labels" . | nindent 4 }}
    app.kubernetes.io/component: airflow
spec:
  selector:
    app.kubernetes.io/name: {{ include "lake-of-tears.name" . }}
    app.kubernetes.io/component: airflow
  ports:
    - name: http
      port: {{ .Values.airflow.service.port }}
      targetPort: http
