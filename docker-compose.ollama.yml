# Optional: run Ollama next to Lake of Tears for AI that never leaves your network.
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d ollama
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml exec ollama ollama pull llama3.2
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml exec ollama ollama pull nomic-embed-text
#
# Then open Settings -> Admin -> AI Provider, choose "Ollama (local models)" and enter:
#   Base URL         http://ollama:11434
#   Chat model       llama3.2
#   Embedding model  nomic-embed-text   (768 dimensions)
#   Query prefix     search_query:      (note the trailing space; nomic-embed-text was trained with it)
#   Document prefix  search_document:   (trailing space)
# and click Test Connection.
#
# The first request loads a model into memory and can take a while. Models are stored in the
# ollama_data volume. For an NVIDIA GPU add a `deploy.resources.reservations.devices` entry
# (see https://docs.ollama.com/docker).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to reach Ollama from the host as well (for example to pull models with the CLI):
    # ports:
    #   - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - datalake

volumes:
  ollama_data:
